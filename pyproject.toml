[project]
name = "cmb-format"
version = "0.2.0.dev0"
description = "Specification and reference implementation of CMB (Cell Model Binary), a file format for cell-based meshes and the models defined on them"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Marchant", email = "dwfmarchant@gmail.com" }]
keywords = ["file-format", "binary-format", "mesh", "octree", "geophysics", "cmb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/dwfmarchant/cmb-format"
Repository = "https://github.com/dwfmarchant/cmb-format"
Changelog = "https://github.com/dwfmarchant/cmb-format/blob/main/CHANGELOG.md"
Issues = "https://github.com/dwfmarchant/cmb-format/issues"
Specification = "https://github.com/dwfmarchant/cmb-format/blob/main/docs/binary-format.md"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmb_format"]

[dependency-groups]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
lint = ["ruff>=0.6"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["cmb_format"]
branch = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "NPY", "RUF", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.format]
docstring-code-format = true
